openapi: 3.1.0
info:
  title: GamarraChain API - Bloque 2 (Módulos 3 y 7 - ROJAS)
  version: 1.0.0
  description: |
    Especificación OpenAPI preliminar (Sección 15 - PC3) correspondiente únicamente al **Bloque 2 (ROJAS)**:
    - **Módulo 3 (`loyalty`):** Billeteras de puntos por emporio, reputación de validadores, campañas de cupones y consumo atómico en POS (*Two-Tier Fast-Gate*).
    - **Módulo 7 (`platform` / `identity` / `audit`):** Aprovisionamiento multi-tenant, roles con alcance jerárquico, parámetros dinámicos en caliente (RF-703), arbitraje de disputas y bitácora criptográfica inmutable SHA-256.
  contact:
    name: Jose Martin Rojas Sánchez (Bloque 2)
servers:
  - url: https://api.gamarrachain.pe/api/v1
    description: Producción (Cloudflare Edge + NestJS Fastify)
  - url: http://localhost:3000/api/v1
    description: Entorno Local / Demo

tags:
  - name: M3 - Billetera y Puntos
    description: Gestión de saldos aislados por emporio (RN-03, AC-301)
  - name: M3 - Validadores
    description: Índice de reputación comunitaria (RF-302, RN-01)
  - name: M3 - Cupones y POS
    description: Catálogo de beneficios y redención atómica Two-Tier Fast-Gate (RF-303, RF-304, AC-302)
  - name: M7 - Emporios y Celdas
    description: Aprovisionamiento multi-tenant y aislamiento RLS (RF-705, RF-706)
  - name: M7 - Parámetros en Caliente
    description: Configuración dinámica runtime vía Valkey Pub/Sub (RF-703)
  - name: M7 - Disputas y Roles
    description: Consola de arbitraje (RF-702) y gestión de Scoped Roles OIDC (RF-701)
  - name: M7 - Auditoría Inmutable
    description: Consulta y verificación de cadena SHA-256 en audit.audit_log (RF-704, AC-702)

security:
  - bearerAuth: []
  - tenantHeader: []

paths:
  # ============================================================================
  # MÓDULO 3: GESTIÓN DE INCENTIVOS Y FIDELIZACIÓN (loyalty)
  # ============================================================================
  /loyalty/wallets/me:
    get:
      tags: [M3 - Billetera y Puntos]
      summary: Consultar saldo de puntos del usuario en el emporio activo (RF-301)
      description: Retorna la billetera aislada al `X-Tenant-Id` actual (RN-03) y sus últimos movimientos.
      responses:
        '200':
          description: Saldo y movimientos recuperados exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /loyalty/points/credit:
    post:
      tags: [M3 - Billetera y Puntos]
      summary: Acreditar puntos por reporte aprobado (RF-301, AC-301)
      description: |
        Ejecuta el crédito contable en `loyalty.wallets_puntos` con bloqueo optimista (`@Version`)
        y reintento automático (`OptimisticLockRetryInterceptor`). Emite `PointsCreditedEvent`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPointsRequest'
      responses:
        '201':
          description: Puntos acreditados correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransaccionPuntos'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /loyalty/validators/me/reputation:
    get:
      tags: [M3 - Validadores]
      summary: Obtener perfil y ratio de reputación del validador (RF-302)
      responses:
        '200':
          description: Perfil de reputación recuperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilValidador'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /loyalty/coupons/campaigns:
    get:
      tags: [M3 - Cupones y POS]
      summary: Listar campañas de cupones vigentes del emporio (RF-303)
      parameters:
        - name: standId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de campañas activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampanaCupon'

  /loyalty/coupons/redeem:
    post:
      tags: [M3 - Cupones y POS]
      summary: Canjear puntos por un cupón digital opaco (RF-303)
      description: Debita puntos de `WalletPuntos` y emite un agregado independiente `CuponCanjeado` con código NanoID-HMAC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campanaId]
              properties:
                campanaId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Cupón emitido en estado `ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuponCanjeado'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /loyalty/pos/coupons/consume:
    post:
      tags: [M3 - Cupones y POS]
      summary: Validar y consumir atómicamente un cupón en terminal POS (RF-304, AC-302)
      description: |
        Protegido por `ValkeyRateLimitGuard` (bloqueo a 3 fallos en < 2 ms) y `AuditTrailInterceptor` (`@Auditable`).
        Ejecuta **Two-Tier Fast-Gate**: script Lua en Valkey (`pos:coupon:*`) + commit ACID `REDEEMED` en PostgreSQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeCouponPosRequest'
      responses:
        '200':
          description: Cupón consumido de forma irrevocable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuponCanjeado'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  # ============================================================================
  # MÓDULO 7: PLATAFORMA, GOBERNANZA Y ADMINISTRACIÓN CENTRALIZADA
  # ============================================================================
  /platform/tenants:
    post:
      tags: [M7 - Emporios y Celdas]
      summary: Aprovisionar nuevo emporio comercial y celda (RF-705, RF-706)
      description: |
        Requiere rol `PLATFORM_SUPERADMIN` con MFA verificado (`ScopedAuthGuard`) y está decorado con `@Auditable`.
        Ejecuta el `TenantProvisioningTemplateEngine` (Template Method) forzando RLS y asiento génesis SHA-256.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTenantRequest'
      responses:
        '201':
          description: Emporio y celda aprovisionados con RLS activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emporio'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /platform/tenants/{emporioId}:
    get:
      tags: [M7 - Emporios y Celdas]
      summary: Obtener configuración maestra y celda del emporio (RF-705)
      parameters:
        - name: emporioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del emporio y su `CellInfrastructure`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emporio'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /platform/parameters:
    put:
      tags: [M7 - Parámetros en Caliente]
      summary: Actualizar parámetro global o por emporio en runtime (RF-703, ADR-209)
      description: Persiste en `platform.system_parameters`, invalida `config:tenant:*` vía Valkey Pub/Sub y registra auditoría `@Auditable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParameterRequest'
      responses:
        '200':
          description: Parámetro actualizado y propagado en caliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParametroSistema'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /platform/disputes:
    get:
      tags: [M7 - Disputas y Roles]
      summary: Listar disputas de catálogo del emporio activo (RF-702)
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA]
      responses:
        '200':
          description: Listado de disputas filtradas por RLS.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisputaCatalogo'

  /platform/disputes/{disputeId}/resolve:
    patch:
      tags: [M7 - Disputas y Roles]
      summary: Arbitrar y resolver una disputa de catálogo (RF-702, RN-01)
      description: Requiere rol `EMPORIO_ADMIN` con MFA. Genera asiento `@Auditable` en `audit.audit_log`.
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, resolucionComentario]
              properties:
                decision:
                  type: string
                  enum: [APROBADA, RECHAZADA]
                resolucionComentario:
                  type: string
      responses:
        '200':
          description: Disputa arbitrada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputaCatalogo'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /platform/roles/assign:
    post:
      tags: [M7 - Disputas y Roles]
      summary: Asignar Scoped Role jerárquico a un usuario (RF-701)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignScopedRoleRequest'
      responses:
        '201':
          description: Rol con alcance asignado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedRole'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /platform/audit-logs:
    get:
      tags: [M7 - Auditoría Inmutable]
      summary: Consultar bitácora criptográfica inmutable del emporio (RF-704, AC-702)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Entradas de `audit.audit_log` ordenadas cronológicamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BitacoraAuditoria'

  /platform/audit-logs/verify:
    get:
      tags: [M7 - Auditoría Inmutable]
      summary: Verificar integridad matemática de la cadena SHA-256 (RF-704)
      responses:
        '200':
          description: Resultado de verificación de cadena encadenada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  emporioId:
                    type: string
                    format: uuid
                  entriesVerified:
                    type: integer
                  chainValid:
                    type: boolean
                  verifiedAt:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token OIDC JWT emitido por Keycloak 26 (identity.users) con claim `mfaVerified` para roles administrativos.
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-Id
      description: UUID del emporio comercial activo usado por `TenantRlsInterceptor` (`SET LOCAL app.current_tenant`).

  responses:
    BadRequestError:
      description: Solicitud inválida (validación de DTO / esquema).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Token OIDC ausente, expirado o contexto multi-tenant faltante (`TenantRlsInterceptor`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Sin alcance válido (`ScopedAuthGuard`) o falta MFA administrativo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Recurso inexistente o aislado fuera del `emporio_id` activo por RLS.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflicto de concurrencia optimista (`@Version`) o cupón ya reservado/consumido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableError:
      description: Regla de negocio incumplida (ej. saldo de puntos insuficiente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequestsError:
      description: Bloqueo preventivo tras 3 intentos fallidos (`ValkeyRateLimitGuard`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance, timestamp, traceId]
      properties:
        type:
          type: string
          example: https://api.gamarrachain.pe/errors/optimistic-lock-conflict
        title:
          type: string
          example: Conflicto de Concurrencia en Billetera
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: La billetera fue modificada concurrentemente tras agotar 3 reintentos.
        instance:
          type: string
          example: /api/v1/loyalty/points/credit
        errorCode:
          type: string
          example: LOYALTY_VERSION_CONFLICT
        emporioId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string

    WalletPuntos:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111101
        saldoPuntos:
          type: integer
          minimum: 0
          example: 450
        version:
          type: integer
          minimum: 1
          example: 2
        updatedAt:
          type: string
          format: date-time

    TransaccionPuntos:
      type: object
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
        tipo:
          type: string
          enum: [CREDITO_REPORTE, DEBITO_CANJE, REVERSION, AJUSTE_ADMIN]
        puntos:
          type: integer
          example: 50
        balancePosterior:
          type: integer
          minimum: 0
          example: 500
        referenciaReporteId:
          type: string
          format: uuid
          nullable: true
        referenciaCuponId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    WalletResponse:
      type: object
      properties:
        wallet:
          $ref: '#/components/schemas/WalletPuntos'
        recentTransactions:
          type: array
          items:
            $ref: '#/components/schemas/TransaccionPuntos'

    CreditPointsRequest:
      type: object
      required: [userId, puntos, referenciaReporteId]
      properties:
        userId:
          type: string
          format: uuid
        puntos:
          type: integer
          minimum: 1
          example: 50
        referenciaReporteId:
          type: string
          format: uuid

    PerfilValidador:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
        reportesAprobados:
          type: integer
        reportesRechazados:
          type: integer
        ratioReputacion:
          type: number
          format: float
          example: 0.9231
        nivelConfianza:
          type: string
          enum: [NIVEL_INICIAL, COLABORADOR, VERIFICADOR_EXPERTO]

    CampanaCupon:
      type: object
      properties:
        id:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
        standId:
          type: string
          format: uuid
        titulo:
          type: string
          example: 15% DCTO en Casacas Denim Mayorista
        costoPuntos:
          type: integer
          example: 100
        porcentajeDescuento:
          type: number
          nullable: true
        montoDescuentoFijo:
          type: number
          nullable: true
        cuposDisponibles:
          type: integer
        estado:
          type: string
          enum: [ACTIVA, PAUSADA, AGOTADA, EXPIRADA]

    CuponCanjeado:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campanaId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        standId:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
        codigoNanoId:
          type: string
          example: GC-7K9P2M-A4F91C
        estado:
          type: string
          enum: [ACTIVE, RESERVED_IN_POS, REDEEMED, EXPIRED]
        emitidoAt:
          type: string
          format: date-time
        expiraAt:
          type: string
          format: date-time
        redimidoAt:
          type: string
          format: date-time
          nullable: true
        ticketVentaPos:
          type: string
          nullable: true

    ConsumeCouponPosRequest:
      type: object
      required: [codigoNanoId, standId, ticketVentaPos]
      properties:
        codigoNanoId:
          type: string
          example: GC-7K9P2M-A4F91C
        standId:
          type: string
          format: uuid
        ticketVentaPos:
          type: string
          example: POS-004821

    Emporio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: gamarra
        nombre:
          type: string
          example: Emporio Comercial de Gamarra
        estado:
          type: string
          enum: [ACTIVO, SUSPENDIDO, EN_CONFIGURACION]
        subdominio:
          type: string
          example: gamarra.gamarrachain.pe
        cellType:
          type: string
          enum: [DEDICATED, SHARED]

    ProvisionTenantRequest:
      type: object
      required: [slug, nombre, boundingBoxWkt, subdominio, cellType]
      properties:
        slug:
          type: string
        nombre:
          type: string
        boundingBoxWkt:
          type: string
        subdominio:
          type: string
        cellType:
          type: string
          enum: [DEDICATED, SHARED]

    ParametroSistema:
      type: object
      properties:
        id:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
          nullable: true
        clave:
          type: string
          example: loyalty.puntos_por_reporte_aprobado
        valor:
          type: string
          example: '50'
        tipoDato:
          type: string
          enum: [INTEGER, DECIMAL, BOOLEAN, STRING, JSON]
        updatedAt:
          type: string
          format: date-time

    UpdateParameterRequest:
      type: object
      required: [clave, valor, tipoDato]
      properties:
        emporioId:
          type: string
          format: uuid
          nullable: true
        clave:
          type: string
        valor:
          type: string
        tipoDato:
          type: string
          enum: [INTEGER, DECIMAL, BOOLEAN, STRING, JSON]

    DisputaCatalogo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
        standId:
          type: string
          format: uuid
        tipoDisputa:
          type: string
          enum: [TITULARIDAD, PRECIO_IRREAL, PLAGIO_FOTO, CATALOGO_FALSO]
        estado:
          type: string
          enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA]
        resolucionComentario:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ScopedRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
        roleType:
          type: string
          enum: [PLATFORM_SUPERADMIN, EMPORIO_ADMIN, GALERIA_ADMIN, MERCHANT, VALIDATOR, BUYER]
        galeriaId:
          type: string
          format: uuid
          nullable: true
        standId:
          type: string
          format: uuid
          nullable: true

    AssignScopedRoleRequest:
      type: object
      required: [userId, roleType]
      properties:
        userId:
          type: string
          format: uuid
        roleType:
          type: string
          enum: [PLATFORM_SUPERADMIN, EMPORIO_ADMIN, GALERIA_ADMIN, MERCHANT, VALIDATOR, BUYER]
        galeriaId:
          type: string
          format: uuid
          nullable: true
        standId:
          type: string
          format: uuid
          nullable: true

    BitacoraAuditoria:
      type: object
      properties:
        id:
          type: string
          format: uuid
        emporioId:
          type: string
          format: uuid
        hashActual:
          type: string
          minLength: 64
          maxLength: 64
        hashAnterior:
          type: string
          minLength: 64
          maxLength: 64
        accion:
          type: string
        entidad:
          type: string
        entidadId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
